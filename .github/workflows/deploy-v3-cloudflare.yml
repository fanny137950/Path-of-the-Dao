name: Diagnose or Deploy WenDao Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '輸入 wendao-living-world 以確認目標 Worker（diagnose 不會部署）'
        required: true
        type: string
      mode:
        description: 'diagnose = 僅檢查，不發布；deploy = 正式部署'
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - deploy

permissions:
  contents: read

concurrency:
  group: wendao-cloudflare-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ inputs.confirmation == 'wendao-living-world' && inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WENDAO_WORKER_NAME: wendao-living-world
    steps:
      - name: Diagnose Cloudflare API without deploying
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing token secret'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Missing or invalid account secret'; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          probe() {
            local label="$1" path="$2" tmp code elapsed
            tmp=$(mktemp)
            read -r code elapsed < <(curl --silent --show-error --max-time 25 \
              -o "$tmp" -w '%{http_code} %{time_total}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API$path") || { echo "$label: transport error or timeout"; rm -f "$tmp"; return 1; }
            local success errors
            success=$(jq -r '.success // false' "$tmp" 2>/dev/null || echo 'non-json')
            errors=$(jq -rc '[.errors[]? | {code,message}]' "$tmp" 2>/dev/null || echo 'response-not-json')
            echo "$label: HTTP $code in ${elapsed}s, success=$success, errors=$errors"
            rm -f "$tmp"
            [[ "$code" == 200 && "$success" == true ]]
          }
          failed=0
          probe 'Token verification' '/user/tokens/verify' || failed=1
          probe 'Worker settings' "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WENDAO_WORKER_NAME/settings" || failed=1
          probe 'D1 list' "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$WENDAO_WORKER_NAME" || failed=1
          probe 'Worker subdomain' "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || failed=1
          echo 'Diagnostic-only: no Worker upload, secret mutation, or database migration performed.'
          exit "$failed"

  deploy:
    if: ${{ inputs.confirmation == 'wendao-living-world' && inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WENDAO_WORKER_NAME: wendao-living-world
    steps:
      - name: Checkout requested production branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test V3 OpenAI adapter
        run: node --test v3/tests/*.test.mjs

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build game
        run: npm run build

      - name: Confirm existing Cloudflare Worker and D1 database
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Cloudflare account ID invalid'; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$API/workers/scripts/$WENDAO_WORKER_NAME/settings"             | jq -e '.success == true' > /dev/null             || { echo 'Existing Worker not found; deployment cancelled'; exit 1; }
          DATA=$(curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$API/d1/database?name=$WENDAO_WORKER_NAME")
          COUNT=$(jq --arg name "$WENDAO_WORKER_NAME" '[.result[] | select(.name == $name)] | length' <<< "$DATA")
          [[ "$COUNT" == '1' ]] || { echo 'Existing D1 database must match exactly once; deployment cancelled'; exit 1; }
          DATABASE_ID=$(jq -r --arg name "$WENDAO_WORKER_NAME" '.result[] | select(.name == $name) | .uuid' <<< "$DATA")
          [[ "$DATABASE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo 'Invalid D1 database UUID'; exit 1; }
          echo "WENDAO_D1_DATABASE_ID=$DATABASE_ID" >> "$GITHUB_ENV"
          echo 'Existing Worker and D1 database verified.'

      - name: Prepare standalone Wrangler config
        run: node scripts/prepare-cloudflare.mjs

      # No D1 migrations or credential changes: this release replaces only the
      # Worker code and static assets, preserving existing login secrets and data.
      - name: Deploy Worker and assets (updated Wrangler with embedded fallback)
        shell: bash
        run: |
          set -euo pipefail
          # Wrangler 4.92 repeatedly timed out fetching Worker dashboard metadata.
          # Test against the newer Wrangler release, without changing the lockfile.
          export CI=true WRANGLER_SEND_METRICS=false
          npm install --global wrangler@4.149.0
          wrangler --version
          if wrangler deploy --config dist/server/wrangler.standalone.json 2>&1 | tee /tmp/wendao-deploy.log; then
            echo 'Standard static-assets deployment succeeded.'
          elif grep -Eq 'assets-upload-session|Unable to fetch bindings, routes, or services metadata' /tmp/wendao-deploy.log; then
            echo 'Cloudflare static-assets service unavailable; switching to embedded preview.'
            node scripts/prepare-preview.mjs
            wrangler deploy --config dist/server/wrangler.preview.json
          else
            echo 'Deployment failed for an unrelated reason; refusing fallback.'
            exit 1
          fi

      - name: Smoke-test site
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30             https://wendao-living-world.danew137950.workers.dev/)
          [[ "$STATUS" == '200' ]] || { echo "Site returned HTTP $STATUS"; exit 1; }
          echo 'Deployed V3 site is responding.'
